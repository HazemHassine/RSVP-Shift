<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fast Reader Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Fast Reader</h1>
        <p>Settings & shortcuts</p>
      </div>
      <button id="toggle-reader" class="primary">Start/Stop</button>
    </header>

    <section class="card">
      <h2>Reading</h2>
      <div class="field">
        <label for="wpm">Words per minute</label>
        <input type="number" id="wpm" min="50" step="50" />
      </div>
      <div class="field">
        <label for="jump">Jump size</label>
        <input type="number" id="jump" min="1" step="1" />
      </div>
      <div class="field">
        <label for="color">Pivot color</label>
        <input type="color" id="color" />
      </div>
      <div class="field">
        <label for="opacity">Background dim</label>
        <input type="range" id="opacity" min="0.5" max="1" step="0.05" />
        <span id="opacity-value" class="value"></span>
      </div>
      <div class="actions">
        <button id="reset" class="ghost">Reset defaults</button>
      </div>
    </section>

    <section class="card">
      <h2>Shortcuts</h2>
      <ul class="shortcuts">
        <li><span>Start/Stop</span><kbd>Ctrl+Shift+Q</kbd> / <kbd>Command+Shift+Q</kbd></li>
        <li><span>Pause/Resume</span><kbd>Space</kbd></li>
        <li><span>Close</span><kbd>Esc</kbd></li>
        <li><span>Speed up/down</span><kbd>↑</kbd> / <kbd>↓</kbd></li>
        <li><span>Jump forward/back</span><kbd>→</kbd> / <kbd>←</kbd></li>
      </ul>
      <div class="actions">
        <button id="open-shortcuts" class="ghost">Edit shortcuts</button>
      </div>
      <p class="hint">Opens Chrome’s shortcut settings page.</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
